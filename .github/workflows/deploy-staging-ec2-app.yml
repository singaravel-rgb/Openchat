name: OpenChat EC2 Staging Application Deploy

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Target branch to deploy'
        required: true
        default: 'release/v1.0.0-aws-production'
  push:
    branches:
      - 'release/v1.0.0-aws-production'

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read    # Required to checkout the repository

jobs:
  deploy-ec2-staging:
    name: Deploy to EC2 Staging via SSM
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Validate Approved Branch Gate
        run: |
          ALLOWED_BRANCH="release/v1.0.0-aws-production"
          CURRENT_BRANCH="${{ github.ref_name }}"
          echo "Verifying trigger branch '$CURRENT_BRANCH' against approved branch '$ALLOWED_BRANCH'..."
          if [ "$CURRENT_BRANCH" != "$ALLOWED_BRANCH" ]; then
            echo "ERROR: Deployments are strictly restricted to '$ALLOWED_BRANCH'. Attempted branch: '$CURRENT_BRANCH'"
            exit 1
          fi
          echo "Branch verification passed: $CURRENT_BRANCH"

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::051372063142:role/openchat-staging-ec2-deployer
          aws-region: ap-south-1
          role-session-name: GitHubActions-OpenChat-EC2-Deployer

      - name: Verify Assumed AWS Identity
        run: |
          echo "=== AWS Caller Identity ==="
          aws sts get-caller-identity

      - name: Dispatch SSM Deployment to EC2 Host
        id: ssm-deploy
        run: |
          INSTANCE_ID="i-0be06fb573c1f1ed6"
          echo "Dispatching deployment command to EC2 instance $INSTANCE_ID..."

          # Define sequential deployment commands
          COMMANDS='[
            "cd /opt/openchat",
            "git fetch origin release/v1.0.0-aws-production",
            "git checkout release/v1.0.0-aws-production",
            "git pull origin release/v1.0.0-aws-production",
            "echo \"=== REMOTE COMMIT ===\" && git log -1 --oneline",
            "docker compose -f docker-compose.test.yml --env-file .env build backend frontend",
            "docker compose -f docker-compose.test.yml --env-file .env up -d --no-deps backend celery-worker celery-beat frontend",
            "docker compose -f docker-compose.test.yml --env-file .env restart nginx",
            "docker compose -f docker-compose.test.yml exec -T backend alembic upgrade head",
            "docker compose -f docker-compose.test.yml exec -T backend python -c \"from app.db.session import SessionLocal; from app.services.bot_flow_service import seed_default_bot_flow; db=SessionLocal(); seed_default_bot_flow(db); print('\''Bot flow seed verified'\'')\"",
            "docker compose -f docker-compose.test.yml ps"
          ]'

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\": $COMMANDS}" \
            --comment "OpenChat staging deployment from GitHub Actions OIDC" \
            --query "Command.CommandId" \
            --output text)

          echo "Dispatched SSM Command ID: $CMD_ID"
          echo "command_id=$CMD_ID" >> $GITHUB_OUTPUT

      - name: Wait for SSM Command Completion
        run: |
          CMD_ID="${{ steps.ssm-deploy.outputs.command_id }}"
          INSTANCE_ID="i-0be06fb573c1f1ed6"
          echo "Monitoring SSM execution for Command ID: $CMD_ID on instance $INSTANCE_ID..."

          for attempt in $(seq 1 90); do
            sleep 10
            STATUS_JSON=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
              --output json)

            STATUS=$(echo "$STATUS_JSON" | jq -r '.Status')
            echo "[$attempt/90] Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "=== DEPLOYMENT SUCCEEDED ==="
              echo "$STATUS_JSON" | jq -r '.Output'
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "=== DEPLOYMENT FAILED ==="
              echo "Standard Output:"
              echo "$STATUS_JSON" | jq -r '.Output'
              echo "Standard Error:"
              echo "$STATUS_JSON" | jq -r '.Error'
              exit 1
            fi
          done

          echo "SSM command monitoring timed out after 15 minutes."
          exit 1

      - name: Smoke Test Live Staging Health
        run: |
          echo "Verifying live staging health endpoint..."
          python3 -c "
          import urllib.request, json
          res = urllib.request.urlopen('https://packs-disposition-drink-notebooks.trycloudflare.com/health', timeout=15)
          print('Health Check Status:', res.getcode(), res.read().decode())
          cfg_res = urllib.request.urlopen('https://packs-disposition-drink-notebooks.trycloudflare.com/api/v1/widget/config', timeout=15)
          print('Widget Config Status:', cfg_res.getcode())
          embed_res = urllib.request.urlopen('https://packs-disposition-drink-notebooks.trycloudflare.com/api/v1/widget/embed.js', timeout=15)
          print('Widget Embed Status:', embed_res.getcode())
          "
