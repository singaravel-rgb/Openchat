name: OpenChat Staging EC2 Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform Action (plan or apply)'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
      plan_run_id:
        description: 'Approved Plan Workflow Run ID (Required for apply)'
        required: false
        default: ''
  push:
    branches:
      - 'release/v1.0.0-aws-production'
    paths:
      - 'infra/terraform-test-ec2/**'
      - '.github/workflows/deploy-staging-ec2.yml'

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read    # Required to checkout the repository
  actions: read     # Required to download plan artifacts across workflow runs

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action == 'apply' && 'Apply' || 'Plan' }} (OpenChat Staging EC2)
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::051372063142:role/openchat-staging-terraform-deployer
          aws-region: ap-south-1
          role-session-name: GitHubActions-OpenChat-Staging

      - name: Verify Assumed AWS Identity
        run: |
          echo "=== AWS Caller Identity ==="
          aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"

      - name: Terraform Format Check
        working-directory: infra/terraform-test-ec2
        run: terraform fmt -check

      - name: Terraform Init (S3 Remote Backend)
        working-directory: infra/terraform-test-ec2
        run: terraform init

      - name: Terraform Validate
        working-directory: infra/terraform-test-ec2
        run: terraform validate

      # ------------------------------------------------------------------------
      # PLAN PATH (Default on push or manual plan dispatch)
      # ------------------------------------------------------------------------
      - name: Untaint Existing Resources
        if: ${{ github.event.inputs.action != 'apply' }}
        working-directory: infra/terraform-test-ec2
        run: |
          echo "=== Untainting existing created resources in remote state ==="
          terraform untaint aws_s3_bucket.db_backups || true
          terraform untaint aws_ssm_parameter.test_env || true

      - name: Terraform Plan (Reviewable Saved Plan - No Auto-Apply)
        if: ${{ github.event.inputs.action != 'apply' }}
        working-directory: infra/terraform-test-ec2
        run: |
          echo "=== Executing Terraform Plan under openchat-staging-terraform-deployer ==="
          terraform plan -no-color -out=staging.tfplan
          terraform show -no-color staging.tfplan > staging-plan-summary.txt
          cat staging-plan-summary.txt

      - name: Preserve Reviewable Saved Plan Artifact
        if: ${{ github.event.inputs.action != 'apply' }}
        uses: actions/upload-artifact@v4
        with:
          name: openchat-staging-ec2-tfplan
          path: |
            infra/terraform-test-ec2/staging-plan-summary.txt
            infra/terraform-test-ec2/staging.tfplan
          retention-days: 7

      # ------------------------------------------------------------------------
      # APPLY PATH (Explicit approval execution using exact reviewed saved plan)
      # ------------------------------------------------------------------------
      - name: Validate Plan Run ID for Apply
        if: ${{ github.event.inputs.action == 'apply' }}
        run: |
          if [ -z "${{ github.event.inputs.plan_run_id }}" ]; then
            echo "ERROR: plan_run_id is required when action is apply."
            exit 1
          fi
          echo "Target approved plan run ID: ${{ github.event.inputs.plan_run_id }}"

      - name: Download Approved Saved Plan Artifact
        if: ${{ github.event.inputs.action == 'apply' }}
        uses: actions/download-artifact@v4
        with:
          name: openchat-staging-ec2-tfplan
          path: infra/terraform-test-ec2
          run-id: ${{ github.event.inputs.plan_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect & Verify Downloaded Plan File
        if: ${{ github.event.inputs.action == 'apply' }}
        working-directory: infra/terraform-test-ec2
        run: |
          echo "=== Verifying downloaded plan file from Run ${{ github.event.inputs.plan_run_id }} ==="
          test -f staging.tfplan || (echo "ERROR: staging.tfplan not found in downloaded artifact!" && exit 1)
          test -f staging-plan-summary.txt || (echo "ERROR: staging-plan-summary.txt not found!" && exit 1)
          echo "=== Verified Plan Summary ==="
          cat staging-plan-summary.txt
          grep -q "Plan: 5 to add, 0 to change, 0 to destroy." staging-plan-summary.txt || (echo "ERROR: Plan summary does not match 5 additions!" && exit 1)

      - name: Terraform Apply (Exact Reviewed Saved Plan)
        if: ${{ github.event.inputs.action == 'apply' }}
        working-directory: infra/terraform-test-ec2
        run: |
          echo "=== Applying Approved Saved Plan staging.tfplan from Run ${{ github.event.inputs.plan_run_id }} ==="
          terraform apply -no-color staging.tfplan
