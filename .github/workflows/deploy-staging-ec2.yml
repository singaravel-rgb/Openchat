name: OpenChat Staging EC2 Terraform Plan

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running staging Terraform plan'
        required: false
        default: 'Review staging plan'
  push:
    branches:
      - 'release/v1.0.0-aws-production'
    paths:
      - 'infra/terraform-test-ec2/**'
      - '.github/workflows/deploy-staging-ec2.yml'

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read    # Required to checkout the repository

jobs:
  terraform-plan:
    name: Terraform Plan (OpenChat Staging EC2)
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Inspect OIDC Token Claims (Non-sensitive)
        run: |
          echo "=== Inspecting GitHub OIDC Token Metadata ==="
          ID_TOKEN=$(curl -sLS "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" -H "User-Agent: actions/oidc-client" -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" | jq -r '.value')
          python3 -c "import sys, json, base64; t=sys.argv[1]; p=t.split('.')[1]; claims=json.loads(base64.urlsafe_b64decode(p + '===').decode('utf-8')); print('sub claim:', claims.get('sub')); print('aud claim:', claims.get('aud')); print('repository:', claims.get('repository')); print('environment:', claims.get('environment')); print('ref:', claims.get('ref'))" "$ID_TOKEN"

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::051372063142:role/openchat-staging-terraform-deployer
          aws-region: ap-south-1
          role-session-name: GitHubActions-OpenChat-Staging-Plan

      - name: Verify Assumed AWS Identity
        run: |
          echo "=== AWS Caller Identity ==="
          aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"

      - name: Terraform Format Check
        working-directory: infra/terraform-test-ec2
        run: terraform fmt -check

      - name: Terraform Init (S3 Remote Backend)
        working-directory: infra/terraform-test-ec2
        run: terraform init

      - name: Terraform Validate
        working-directory: infra/terraform-test-ec2
        run: terraform validate

      - name: Terraform Plan (Reviewable Artifact - No Auto-Apply)
        working-directory: infra/terraform-test-ec2
        run: |
          echo "=== Executing Terraform Plan under openchat-staging-terraform-deployer ==="
          terraform plan -no-color -out=staging.tfplan
          terraform show -no-color staging.tfplan > staging-plan-summary.txt
          cat staging-plan-summary.txt

      - name: Preserve Reviewable Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openchat-staging-ec2-tfplan
          path: infra/terraform-test-ec2/staging-plan-summary.txt
          retention-days: 7
