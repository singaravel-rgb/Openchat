name: Deploy to AWS Staging

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual staging deployment'
        required: false
        default: 'Manual test release'

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read    # Required to checkout the repository

jobs:
  test-and-verify:
    name: Run Test Suite Before Staging Deploy
    uses: ./.github/workflows/ci.yml

  deploy-staging:
    name: Deploy to AWS Staging (ECS Fargate)
    needs: [test-and-verify]
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: GitHubActions-OpenChat-Staging

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Image Tags
        id: image-meta
        run: |
          IMAGE_TAG="${GITHUB_SHA::8}"
          echo "tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "BACKEND_REPO=${{ steps.login-ecr.outputs.registry }}/openchat-staging/backend" >> $GITHUB_ENV
          echo "FRONTEND_REPO=${{ steps.login-ecr.outputs.registry }}/openchat-staging/frontend" >> $GITHUB_ENV

      - name: Build and Push Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_REPO }}:${{ steps.image-meta.outputs.tag }}
            ${{ env.BACKEND_REPO }}:staging-latest

      - name: Build and Push Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_REPO }}:${{ steps.image-meta.outputs.tag }}
            ${{ env.FRONTEND_REPO }}:staging-latest

      - name: Deploy to ECS Staging Services (Immutable Image Tag)
        run: |
          CLUSTER_NAME="openchat-staging-cluster"
          IMAGE_TAG="${{ steps.image-meta.outputs.tag }}"
          
          # Update Backend Task Definition with immutable image tag
          BACKEND_DEF=$(aws ecs describe-task-definition --task-definition openchat-staging-backend --query taskDefinition)
          NEW_BACKEND_DEF=$(echo "$BACKEND_DEF" | jq --arg IMAGE "${{ env.BACKEND_REPO }}:$IMAGE_TAG" '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')
          NEW_BACKEND_ARN=$(aws ecs register-task-definition --cli-input-json "$NEW_BACKEND_DEF" --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "$CLUSTER_NAME" --service "openchat-staging-backend" --task-definition "$NEW_BACKEND_ARN"
          
          # Update Frontend Task Definition with immutable image tag
          FRONTEND_DEF=$(aws ecs describe-task-definition --task-definition openchat-staging-frontend --query taskDefinition)
          NEW_FRONTEND_DEF=$(echo "$FRONTEND_DEF" | jq --arg IMAGE "${{ env.FRONTEND_REPO }}:$IMAGE_TAG" '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')
          NEW_FRONTEND_ARN=$(aws ecs register-task-definition --cli-input-json "$NEW_FRONTEND_DEF" --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "$CLUSTER_NAME" --service "openchat-staging-frontend" --task-definition "$NEW_FRONTEND_ARN"

      - name: Wait for Staging Services Stabilization
        run: |
          CLUSTER_NAME="openchat-staging-cluster"
          aws ecs wait services-stable --cluster "$CLUSTER_NAME" --services "openchat-staging-backend" "openchat-staging-frontend"

      - name: Run Automated Staging Smoke Tests
        env:
          STAGING_URL: ${{ secrets.STAGING_APPLICATION_URL }}
        run: |
          python -m pip install httpx
          python scripts/aws_smoke_tests.py --url "$STAGING_URL"
