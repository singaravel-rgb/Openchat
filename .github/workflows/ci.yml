name: OpenChat CI/CD Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Pytest & Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: openchat_test
          POSTGRES_USER: openchat
          POSTGRES_PASSWORD: testpassword123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Run Alembic Migrations
        env:
          POSTGRES_DB: openchat_test
          POSTGRES_USER: openchat
          POSTGRES_PASSWORD: testpassword123
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          DATABASE_URL: postgresql+psycopg://openchat:testpassword123@localhost:5432/openchat_test
          PYTHONPATH: backend
        run: |
          python -m alembic -c backend/alembic.ini upgrade head

      - name: Run Pytest Suite
        env:
          POSTGRES_DB: openchat_test
          POSTGRES_USER: openchat
          POSTGRES_PASSWORD: testpassword123
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          DATABASE_URL: postgresql+psycopg://openchat:testpassword123@localhost:5432/openchat_test
          REDIS_URL: redis://localhost:6379/0
          PYTHONPATH: backend
          JWT_SECRET_KEY: test_jwt_secret_for_ci_pipeline_only_32_bytes!
          SECRET_KEY: test_secret_key_for_ci_pipeline_only_32_bytes!
          ENVIRONMENT: testing
        run: |
          python -m pytest backend/tests

  frontend-build:
    name: Frontend TypeScript & Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm --prefix frontend ci

      - name: Next.js Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: |
          npm --prefix frontend run build
