name: Deploy to AWS Production

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      rollback_tag:
        description: 'Leave empty unless rolling back to a previous image tag'
        required: false
        default: ''

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read    # Required to checkout the repository

jobs:
  production-gate:
    name: Production Release Gate & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Verify Release Tag
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          echo "Initiating production release verification for version: $VERSION"

  deploy-production:
    name: Production Deployment (ECS Fargate)
    needs: [production-gate]
    runs-on: ubuntu-latest
    environment: production # Requires manual approval / protection rules in GitHub Settings

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: GitHubActions-OpenChat-Production

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Release Image Tags
        id: image-meta
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          ROLLBACK="${{ github.event.inputs.rollback_tag }}"
          if [ -n "$ROLLBACK" ]; then
            echo "ROLLBACK MODE: Deploying existing tag $ROLLBACK"
            echo "deploy_tag=$ROLLBACK" >> $GITHUB_OUTPUT
            echo "is_rollback=true" >> $GITHUB_OUTPUT
          else
            echo "deploy_tag=$VERSION" >> $GITHUB_OUTPUT
            echo "is_rollback=false" >> $GITHUB_OUTPUT
          fi
          echo "BACKEND_REPO=${{ steps.login-ecr.outputs.registry }}/openchat-production/backend" >> $GITHUB_ENV
          echo "FRONTEND_REPO=${{ steps.login-ecr.outputs.registry }}/openchat-production/frontend" >> $GITHUB_ENV

      - name: Build and Push Backend Container Image (Production)
        if: steps.image-meta.outputs.is_rollback == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_REPO }}:${{ steps.image-meta.outputs.deploy_tag }}
            ${{ env.BACKEND_REPO }}:latest

      - name: Build and Push Frontend Container Image (Production)
        if: steps.image-meta.outputs.is_rollback == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_REPO }}:${{ steps.image-meta.outputs.deploy_tag }}
            ${{ env.FRONTEND_REPO }}:latest

      - name: Retag Rollback Images as Latest in ECR
        if: steps.image-meta.outputs.is_rollback == 'true'
        run: |
          ROLLBACK_TAG="${{ steps.image-meta.outputs.deploy_tag }}"
          echo "Rolling back ECR images to tag: $ROLLBACK_TAG"
          
          # Retag backend image as latest
          BACKEND_MANIFEST=$(aws ecr batch-get-image --repository-name openchat-production/backend --image-ids imageTag="$ROLLBACK_TAG" --query 'images[].imageManifest' --output text)
          if [ -n "$BACKEND_MANIFEST" ] && [ "$BACKEND_MANIFEST" != "None" ]; then
            aws ecr put-image --repository-name openchat-production/backend --image-tag latest --image-manifest "$BACKEND_MANIFEST"
            echo "Successfully restored openchat-production/backend:latest to $ROLLBACK_TAG"
          else
            echo "ERROR: Backend image with tag '$ROLLBACK_TAG' not found in ECR!"
            exit 1
          fi

          # Retag frontend image as latest
          FRONTEND_MANIFEST=$(aws ecr batch-get-image --repository-name openchat-production/frontend --image-ids imageTag="$ROLLBACK_TAG" --query 'images[].imageManifest' --output text)
          if [ -n "$FRONTEND_MANIFEST" ] && [ "$FRONTEND_MANIFEST" != "None" ]; then
            aws ecr put-image --repository-name openchat-production/frontend --image-tag latest --image-manifest "$FRONTEND_MANIFEST"
            echo "Successfully restored openchat-production/frontend:latest to $ROLLBACK_TAG"
          else
            echo "ERROR: Frontend image with tag '$ROLLBACK_TAG' not found in ECR!"
            exit 1
          fi

      - name: Deploy to ECS Production Services (Immutable Image Tag & Rolling Update)
        run: |
          CLUSTER_NAME="openchat-production-cluster"
          DEPLOY_TAG="${{ steps.image-meta.outputs.deploy_tag }}"
          echo "Deploying to production ECS cluster using immutable image tag: $DEPLOY_TAG"
          
          # Update Backend Task Definition with immutable image tag
          BACKEND_DEF=$(aws ecs describe-task-definition --task-definition openchat-production-backend --query taskDefinition)
          NEW_BACKEND_DEF=$(echo "$BACKEND_DEF" | jq --arg IMAGE "${{ env.BACKEND_REPO }}:$DEPLOY_TAG" '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')
          NEW_BACKEND_ARN=$(aws ecs register-task-definition --cli-input-json "$NEW_BACKEND_DEF" --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "$CLUSTER_NAME" --service "openchat-production-backend" --task-definition "$NEW_BACKEND_ARN"
          
          # Update Frontend Task Definition with immutable image tag
          FRONTEND_DEF=$(aws ecs describe-task-definition --task-definition openchat-production-frontend --query taskDefinition)
          NEW_FRONTEND_DEF=$(echo "$FRONTEND_DEF" | jq --arg IMAGE "${{ env.FRONTEND_REPO }}:$DEPLOY_TAG" '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')
          NEW_FRONTEND_ARN=$(aws ecs register-task-definition --cli-input-json "$NEW_FRONTEND_DEF" --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "$CLUSTER_NAME" --service "openchat-production-frontend" --task-definition "$NEW_FRONTEND_ARN"

      - name: Wait for Production Services Stabilization
        run: |
          CLUSTER_NAME="openchat-production-cluster"
          aws ecs wait services-stable --cluster "$CLUSTER_NAME" --services "openchat-production-backend" "openchat-production-frontend"

      - name: Run Production Smoke Verification
        id: smoke-test
        env:
          PROD_URL: ${{ secrets.PRODUCTION_APPLICATION_URL }}
        run: |
          python -m pip install httpx
          python scripts/aws_smoke_tests.py --url "$PROD_URL"

      - name: Rollback Safety Handler
        if: failure()
        run: |
          echo "CRITICAL: Production smoke test failed. Rollback procedure initiated."
          echo "Please review logs in CloudWatch: /ecs/openchat-production-backend"
