events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream services
    upstream backend_svc {
        server backend:8000;
    }

    upstream frontend_svc {
        server frontend:3000;
    }

    # Staging HTTP Server (for private internal access via AWS SSM port forwarding to localhost:8080)
    server {
        listen 80;
        server_name _;

        client_max_body_size 15M;

        # Security Headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Static Widget Assets
        location /widget/ {
            alias /var/www/widget/;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "*";
            try_files $uri $uri/ =404;
        }

        # Backend API, Docs, and Health endpoints
        location ~ ^/(api/|health|docs|openapi.json) {
            proxy_pass http://backend_svc;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_read_timeout 120s;
        }

        # Frontend Next.js Application
        location / {
            proxy_pass http://frontend_svc;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
